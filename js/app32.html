<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            margin: 0;
        }

        header {
            background: #333;
            color: white;
            padding: 25px;
        }

        .box {
            background: white;
            width: 400px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #bbb;
        }

        input {
            padding: 10px;
            width: 65%;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #333;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        li {
            list-style: none;
            padding: 12px;
            margin: 8px;
            background: #eee;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Task Manager</h1>
        <p>Organize your daily tasks</p>
    </header>

    <div class="box">
        <input type="text" id="task" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>

        <ul id="list"></ul>
    </div>

    <script>
        function addTask() {
            let input = document.getElementById("task");
            let value = input.value.trim();

            if (value === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");
            li.textContent = value;

            li.onclick = function () {
                li.style.textDecoration = "line-through";
            };

            document.getElementById("list").appendChild(li);
            input.value = "";
        }
    </script>

</body>
</html>
