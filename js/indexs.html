<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #555;
        }

        .card p {
            font-size: 25px;
            font-weight: bold;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .form {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        input,
        select,
        button {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            cursor: pointer;
            background: #222;
            color: white;
            border: none;
        }

        button:hover {
            opacity: 0.85;
        }

        .expense-list {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .expense {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #ddd;
            align-items: center;
        }

        .delete-btn {
            background: crimson;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media(max-width: 800px) {
            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .form {
                grid-template-columns: 1fr 1fr;
            }

            .expense {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Expense Tracker Dashboard</h1>

    <div class="summary">

        <div class="card">
            <h3>Total Expense</h3>
            <p id="totalExpense">₹0</p>
        </div>

        <div class="card">
            <h3>Highest Expense</h3>
            <p id="highestExpense">₹0</p>
        </div>

        <div class="card">
            <h3>Total Transactions</h3>
            <p id="totalTransactions">0</p>
        </div>

        <div class="card">
            <h3>Average Expense</h3>
            <p id="averageExpense">₹0</p>
        </div>

    </div>


    <div class="form-box">

        <h2>Add Expense</h2>

        <br>

        <div class="form">

            <input
                type="text"
                id="title"
                placeholder="Expense title"
            >

            <input
                type="number"
                id="amount"
                placeholder="Amount"
            >

            <select id="category">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <input
                type="date"
                id="date"
            >

        </div>

        <br>

        <button onclick="addExpense()">
            Add Expense
        </button>

    </div>


    <div class="expense-list">

        <h2>All Expenses</h2>

        <br>

        <div class="filters">

            <input
                type="text"
                id="search"
                placeholder="Search expense..."
                oninput="displayExpenses()"
            >

            <select
                id="filterCategory"
                onchange="displayExpenses()"
            >
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <select
                id="sortExpense"
                onchange="displayExpenses()"
            >
                <option value="latest">Latest</option>
                <option value="high">Highest Amount</option>
                <option value="low">Lowest Amount</option>
            </select>

        </div>

        <div id="expenseContainer"></div>

    </div>

</div>


<script>

let expenses = JSON.parse(localStorage.getItem("expenses")) || [

    {
        id: 1,
        title: "College Canteen",
        amount: 150,
        category: "Food",
        date: "2026-08-10"
    },

    {
        id: 2,
        title: "Bus Ticket",
        amount: 80,
        category: "Travel",
        date: "2026-08-11"
    },

    {
        id: 3,
        title: "Java Course",
        amount: 500,
        category: "Education",
        date: "2026-08-12"
    },

    {
        id: 4,
        title: "Shopping",
        amount: 1200,
        category: "Shopping",
        date: "2026-08-13"
    }

];


function saveData() {

    localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
    );

}


function addExpense() {

    let title = document
        .getElementById("title")
        .value
        .trim();

    let amount = Number(
        document.getElementById("amount").value
    );

    let category = document
        .getElementById("category")
        .value;

    let date = document
        .getElementById("date")
        .value;


    if (title === "") {

        alert("Please enter expense title");
        return;

    }


    if (amount <= 0) {

        alert("Amount must be greater than 0");
        return;

    }


    if (date === "") {

        alert("Please select date");
        return;

    }


    let newExpense = {

        id: Date.now(),

        title: title,

        amount: amount,

        category: category,

        date: date

    };


    expenses.push(newExpense);


    saveData();

    displayExpenses();

    updateDashboard();


    document.getElementById("title").value = "";

    document.getElementById("amount").value = "";

    document.getElementById("date").value = "";

}


function deleteExpense(id) {

    expenses = expenses.filter(function(expense) {

        return expense.id !== id;

    });


    saveData();

    displayExpenses();

    updateDashboard();

}


function displayExpenses() {

    let container =
        document.getElementById("expenseContainer");

    let search =
        document.getElementById("search")
        .value
        .toLowerCase();

    let category =
        document.getElementById("filterCategory")
        .value;

    let sort =
        document.getElementById("sortExpense")
        .value;


    let result = expenses.filter(function(expense) {

        let searchMatch =
            expense.title
            .toLowerCase()
            .includes(search);

        let categoryMatch =
            category === "All" ||
            expense.category === category;

        return searchMatch && categoryMatch;

    });


    if (sort === "high") {

        result.sort(function(a, b) {

            return b.amount - a.amount;

        });

    }


    if (sort === "low") {

        result.sort(function(a, b) {

            return a.amount - b.amount;

        });

    }


    if (sort === "latest") {

        result.sort(function(a, b) {

            return new Date(b.date) -
                   new Date(a.date);

        });

    }


    container.innerHTML = "";


    if (result.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No expenses found
            </div>
        `;

        return;

    }


    result.forEach(function(expense) {

        let div = document.createElement("div");

        div.className = "expense";


        div.innerHTML = `

            <strong>
                ${expense.title}
            </strong>

            <span>
                ₹${expense.amount}
            </span>

            <span>
                ${expense.category}
            </span>

            <span>
                ${expense.date}
            </span>

            <button
                class="delete-btn"
                onclick="deleteExpense(${expense.id})"
            >
                Delete
            </button>

        `;


        container.appendChild(div);

    });

}


function updateDashboard() {

    let total = expenses.reduce(
        function(sum, expense) {

            return sum + expense.amount;

        },
        0
    );


    let highest = expenses.length > 0
        ? Math.max(
            ...expenses.map(function(expense) {
                return expense.amount;
            })
        )
        : 0;


    let count = expenses.length;


    let average = count > 0
        ? total / count
        : 0;


    document.getElementById("totalExpense")
        .innerText = "₹" + total;


    document.getElementById("highestExpense")
        .innerText = "₹" + highest;


    document.getElementById("totalTransactions")
        .innerText = count;


    document.getElementById("averageExpense")
        .innerText =
            "₹" + average.toFixed(2);

}


function categorySummary() {

    let summary = expenses.reduce(
        function(result, expense) {

            if (!result[expense.category]) {

                result[expense.category] = 0;

            }

            result[expense.category] += expense.amount;

            return result;

        },
        {}
    );


    console.log("Category Summary:", summary);

}


function getHighestExpenses() {

    let highest = [...expenses]
        .sort(function(a, b) {

            return b.amount - a.amount;

        })
        .slice(0, 3);


    console.log(
        "Top 3 Expenses:",
        highest
    );

}


function getMonthlyExpense() {

    let monthly = expenses.reduce(
        function(result, expense) {

            let month =
                expense.date.substring(0, 7);


            if (!result[month]) {

                result[month] = 0;

            }


            result[month] += expense.amount;


            return result;

        },
        {}
    );


    console.log(
        "Monthly Expense:",
        monthly
    );

}


function showStatistics() {

    categorySummary();

    getHighestExpenses();

    getMonthlyExpense();

}


displayExpenses();

updateDashboard();

showStatistics();

</script>

</body>
</html>
